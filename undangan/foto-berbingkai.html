<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Foto Berbingkai - Almarhum Fahri Ramon Amati</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; }
  body { display: flex; justify-content: center; padding: 10mm; font-family: Arial, "Liberation Sans", sans-serif; }
  .arch { position: relative; width: 80mm; padding: 1.6mm; border: 1.6mm solid #000; border-radius: 999px 999px 0 0; background: #fff; }
  .arch-in { padding: 1.4mm; border: .5mm solid #000; border-radius: 999px 999px 0 0; }
  .arch-in2 { padding: 1.2mm; border: 1.2mm solid #000; border-radius: 999px 999px 0 0; }
  .arch img { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; object-position: top; border-radius: 999px 999px 0 0; }
  .tip { position: absolute; left: 50%; top: -5.2mm; width: 5mm; height: 5mm; background: #000; transform: translateX(-50%) rotate(45deg); }
  .plate { margin-top: 3mm; text-align: center; border-top: 1.6mm solid #000; padding-top: 1.6mm; }
  .plate b { display: block; font-size: 5mm; letter-spacing: .2mm; }
  .plate span { display: block; margin-top: 1mm; font-size: 3.2mm; }
  .wrap { width: 80mm; padding-top: 6mm; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="arch">
      <div class="tip"></div>
      <div class="arch-in"><div class="arch-in2"><img src="img/foto-warna.jpg" alt="Almarhum Fahri Ramon Amati"></div></div>
    </div>
    <div class="plate"><b>FAHRI RAMON AMATI</b><span>Takziah &amp; Doa Arwah Hari Ke-5</span></div>
  </div>
</body>
</html>
