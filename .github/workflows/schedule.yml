name: Auto Stockbit Scanner Schedule

on:
  schedule:
    # 10:30 WIB (03:30 UTC) - Running Sesi 1 Pagi
    - cron: '30 3 * * 1-5'
    # 14:30 WIB (07:30 UTC) - Running Sesi 2 Sore
    - cron: '30 7 * * 1-5'
    # 21:00 WIB (14:00 UTC) - Running Evaluasi BTST Malam
    - cron: '0 14 * * 1-5'
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Auto Scanner
        run: python auto_scanner.py
