name: Complete High-Precision Stockbit Radar Schedule

on:
  schedule:
    # 🎁 DIVIDEND & CORPORATE ACTION RADAR (08:30 WIB)
    - cron: '30 1 * * 1-5'
    # 🚨 FAST TRADE PASAR BUKA (09:20 WIB)
    - cron: '20 2 * * 1-5'
    # ⚡ FAST TRADE MID-SESSION (10:00 & 13:45 WIB)
    - cron: '0 3 * * 1-5'
    - cron: '45 6 * * 1-5'
    # 🕵️‍♂️ BANDAR SILENT ACCUMULATION RADAR (11:30 & 19:30 WIB)
    - cron: '30 4 * * 1-5'
    - cron: '30 12 * * 1-5'
    # 📉 OVERSOLD & BULLISH REVERSAL RADAR (12:15 & 18:00 WIB)
    - cron: '15 5 * * 1-5'
    - cron: '0 11 * * 1-5'
    # 💎 MASTER PRECISION SCANNER & BTST (10:30, 14:30 & 21:00 WIB)
    - cron: '30 3 * * 1-5'
    - cron: '30 7 * * 1-5'
    - cron: '0 14 * * 1-5'

  workflow_dispatch:

jobs:
  run-all-scanners:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Eksekusi Skrip (Aman jika ada file yang belum sempat dibuat)
      - name: Run Master Precision Engine
        run: test -f master_precision_engine.py && python master_precision_engine.py || echo "File master_precision_engine.py tidak ditemukan, dilewati."

      - name: Run Dividend & Action Scanner
        run: test -f dividend_action_scanner.py && python dividend_action_scanner.py || echo "File dividend_action_scanner.py tidak ditemukan, dilewati."

      - name: Run Early Opening Scalp Scanner
        run: test -f early_scalp_scanner.py && python early_scalp_scanner.py || echo "File early_scalp_scanner.py tidak ditemukan, dilewati."

      - name: Run Mid-Session Scalp Scanner
        run: test -f scalp_scanner.py && python scalp_scanner.py || echo "File scalp_scanner.py tidak ditemukan, dilewati."

      - name: Run Bandar Accumulation Scanner
        run: test -f bandar_accumulation_scanner.py && python bandar_accumulation_scanner.py || echo "File bandar_accumulation_scanner.py tidak ditemukan, dilewati."

      - name: Run Oversold Reversal Scanner
        run: test -f oversold_reversal_scanner.py && python oversold_reversal_scanner.py || echo "File oversold_reversal_scanner.py tidak ditemukan, dilewati."

      - name: Run BTST Auto Scanner
        run: test -f auto_scanner.py && python auto_scanner.py || echo "File auto_scanner.py tidak ditemukan, dilewati."
