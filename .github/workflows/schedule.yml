name: Complete Stockbit Trading Radar Schedule

on:
  schedule:
    # ----------------------------------------------------
    # 🎁 DIVIDEND & CORPORATE ACTION RADAR
    # ----------------------------------------------------
    # Jam 08:30 WIB (01:30 UTC)
    - cron: '30 1 * * 1-5'

    # ----------------------------------------------------
    # 🚨 FAST TRADE PASAR BUKA (EARLY MOMENTUM)
    # ----------------------------------------------------
    # Jam 09:20 WIB (02:20 UTC)
    - cron: '20 2 * * 1-5'

    # ----------------------------------------------------
    # ⚡ FAST TRADE / SCALPING MID-SESSION
    # ----------------------------------------------------
    # Jam 10:00 WIB (03:00 UTC)
    - cron: '0 3 * * 1-5'
    # Jam 13:45 WIB (06:45 UTC)
    - cron: '45 6 * * 1-5'

    # ----------------------------------------------------
    # 🕵️‍♂️ BANDAR SILENT ACCUMULATION RADAR
    # ----------------------------------------------------
    # Jam 11:30 WIB (04:30 UTC) - Akhir Sesi 1
    - cron: '30 4 * * 1-5'
    # Jam 19:30 WIB (12:30 UTC) - Evaluasi Malam
    - cron: '30 12 * * 1-5'

    # ----------------------------------------------------
    # 📉 OVERSOLD & BULLISH REVERSAL RADAR (JENUH JUAL)
    # ----------------------------------------------------
    # Jam 12:15 WIB (05:15 UTC)
    - cron: '15 5 * * 1-5'
    # Jam 18:00 WIB (11:00 UTC)
    - cron: '0 11 * * 1-5'

    # ----------------------------------------------------
    # 📊 AUTO SCANNER BTST RUTIN
    # ----------------------------------------------------
    # Jam 10:30 WIB (03:30 UTC)
    - cron: '30 3 * * 1-5'
    # Jam 14:30 WIB (07:30 UTC)
    - cron: '30 7 * * 1-5'
    # Jam 21:00 WIB (14:00 UTC)
    - cron: '0 14 * * 1-5'

  workflow_dispatch:

jobs:
  run-all-scanners:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 1. Radar Dividen & Aksi Korporasi
      - name: Run Dividend & Action Scanner
        run: python dividend_action_scanner.py

      # 2. Fast Trade Buka Pasar
      - name: Run Early Opening Scalp Scanner
        run: python early_scalp_scanner.py

      # 3. Fast Trade Pertengahan Sesi
      - name: Run Mid-Session Scalp Scanner
        run: python scalp_scanner.py

      # 4. Radar Akumulasi Bandar
      - name: Run Bandar Accumulation Scanner
        run: python bandar_accumulation_scanner.py

      # 5. Radar Jenuh Jual / Reversal
      - name: Run Oversold Reversal Scanner
        run: python oversold_reversal_scanner.py

      # 6. BTST Auto Scanner Rutin
      - name: Run BTST Auto Scanner
        run: python auto_scanner.py
