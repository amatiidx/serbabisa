name: Complete High-Precision Stockbit Radar Schedule

on:
  schedule:
    # 09:02 WIB -> Geser 2 menit dari jam 9 bulat agar lepas dari antrean utama
    - cron: '2 2 * * 1-5'
    
    # 09:16 WIB -> Tepat setelah 15 menit bursa berjalan
    - cron: '16 2 * * 1-5'

    # Jadwal Sesi Perdagangan Lainnya (Gunakan menit ganjil)
    - cron: '33 3 * * 1-5'  # 10:33 WIB
    - cron: '33 4 * * 1-5'  # 11:33 WIB
    - cron: '33 7 * * 1-5'  # 14:33 WIB
    - cron: '33 12 * * 1-5' # 19:33 WIB

  workflow_dispatch:

jobs:
  run-all-scanners:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests mplfinance matplotlib

      - name: Run Master Precision Engine
        run: python master_precision_engine.py
